<title>Agent HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: the office fills the viewport. A thin control strip sits on top. Everything else opens as a card over the office. */
:root{
  --ink:#0B0D17; --panel:#121729; --panel2:#182039; --line:#2E3A62; --line2:#45558C;
  --cream:#F3EAD7; --muted:#A3AECD; --dim:#7682A6;
  --frame:#C9887C; --frame-hi:#F0C3B6; --frame-lo:#6E3F3A;
  --gold:#F2C14E; --green:#63D68F; --coral:#F07B63; --red:#E85A5A; --cyan:#6FD3E8; --violet:#B48CFF;
  --f-pixel:'Press Start 2P', ui-monospace, monospace;
  --f-body:'VT323', ui-monospace, 'Courier New', monospace;
  --body-size:21px;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ink);color:var(--cream);font-family:var(--f-body);font-size:var(--body-size);line-height:1.2;-webkit-font-smoothing:none}
body.clean{--f-pixel:system-ui,-apple-system,'Segoe UI',sans-serif;--f-body:system-ui,-apple-system,'Segoe UI',sans-serif;--body-size:15px;-webkit-font-smoothing:auto}
body.big{--body-size:25px}
body.clean.big{--body-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.px{font-family:var(--f-pixel);letter-spacing:.5px}

/* shell */
.shell{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.strip{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top,0px));transform:translate(-50%,-160%);transition:transform .2s;z-index:20;max-width:calc(100% - 16px);flex-wrap:wrap;justify-content:center;border:3px solid #05060C;box-shadow:inset 0 0 0 2px var(--frame);flex-shrink:0;display:flex;align-items:center;gap:6px;padding:6px max(10px,env(safe-area-inset-left,0px));background:#0E1222;border-bottom:3px solid #05060C;box-shadow:inset 0 -2px 0 var(--line);overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip.show,.strip:focus-within{transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.strip{transition:none}}
.toolcap{flex-basis:100%;text-align:center;font-family:var(--f-pixel);font-size:7px;color:var(--frame-hi);padding:2px 0 4px}
.hud{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:8px;z-index:6;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:rgba(14,18,34,.92);border:3px solid #05060C;box-shadow:inset 0 0 0 2px var(--line);padding:4px 6px;max-width:calc(100% - 16px)}
.hud .sbtn{min-height:36px;padding:6px 8px}
.brand{display:flex;align-items:center;gap:8px;padding-right:6px;flex-shrink:0}
.brand b{font-family:var(--f-pixel);font-size:11px;white-space:nowrap}
.brand b span{color:var(--gold)}
.sbtn{flex-shrink:0;display:flex;align-items:center;gap:8px;font-family:var(--f-pixel);font-size:9px;line-height:1.3;background:#1A2342;border:3px solid #05060C;box-shadow:inset 0 0 0 2px var(--line2);padding:8px 10px;min-height:44px;min-width:44px;cursor:pointer;color:var(--cream);white-space:nowrap;justify-content:center}
body.clean .sbtn{font-size:13px}
.sbtn:hover{background:#22305A}
.sbtn canvas{width:16px;height:16px;image-rendering:pixelated}
.sbtn.floorbtn{background:#20182A;box-shadow:inset 0 0 0 2px var(--frame)}
.sbtn.attn{background:#2A2210;box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold)}
.sbtn.attn.zero{background:#1A2342;box-shadow:inset 0 0 0 2px var(--line2);color:var(--muted)}
.sbtn[aria-pressed="true"]{background:var(--gold);color:#1A1204;box-shadow:inset 0 0 0 2px #FFE7A3}
.state{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:var(--f-pixel);font-size:9px;padding:0 6px;white-space:nowrap}
body.clean .state{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-pixel);font-size:7px;line-height:1.3;padding:4px 6px;background:#1C2440;color:var(--muted);border:2px solid #05060C;white-space:nowrap}
body.clean .chip{font-size:11px}
.chip.sim{background:#2A1C3A;color:#D8B8FF}
.dot{width:8px;height:8px;display:inline-block;flex-shrink:0}
.spacer{flex:1;min-width:6px}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.blink{animation:none}}
.lbl-txt{display:inline}
@media (max-width:1100px){.sbtn .lbl-txt{display:none}.sbtn.floorbtn .lbl-txt,.sbtn.attn .lbl-txt{display:inline}}
@media (max-width:700px){.brand b{display:none}.sbtn.floorbtn .lbl-txt{display:none}}

/* stage */
.stagewrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#07080F;overflow:hidden;box-sizing:border-box}
.stagewrap.rp{padding-bottom:44px}
.stagebox{position:relative;flex-shrink:0}
.stagebox.replay{filter:grayscale(1) contrast(1.05)}
#floor{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-pixel);font-size:var(--lblsize,8px);white-space:nowrap;color:var(--cream);text-shadow:1px 1px 0 #05060C;line-height:1.2}
body.clean .lbl{font-family:system-ui,sans-serif;font-size:calc(var(--lblsize,8px) * 1.4)}
.lbl.sign{background:#05060C;padding:2px 4px;color:var(--frame-hi)}
.lbl.tag{background:var(--green);color:#05060C;padding:3px 5px;text-shadow:none;transform:translate(-50%,-100%)}
.lbl.sk{font-size:calc(var(--lblsize,8px) * .62);color:#F4EEDC;text-shadow:none}
.lbl.sk.grp{color:#2A1A06;font-size:calc(var(--lblsize,8px) * .7)}
.lbl.obj{background:rgba(5,6,12,.85);color:var(--gold);padding:2px 4px}
.norec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.norec span{background:#05060C;border:3px solid var(--line2);padding:10px 14px;font-family:var(--f-pixel);font-size:10px;color:var(--cream)}
.banner{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;background:#05060C;border:3px solid #05060C;box-shadow:inset 0 0 0 2px var(--cream);padding:4px 4px 4px 8px;max-width:calc(100% - 16px);white-space:nowrap}
.banner b{font-family:var(--f-pixel);font-size:10px;color:#05060C;background:var(--cream);padding:4px 6px}
.banner span{font-size:18px;overflow:hidden;text-overflow:ellipsis}
.banner .btn{min-height:36px;padding:6px 8px}
.btn{font-family:var(--f-pixel);font-size:9px;line-height:1.4;background:#1A2342;border:3px solid #05060C;box-shadow:inset 0 0 0 2px var(--line2),inset -3px -3px 0 2px #0D1328;padding:9px 12px;min-height:44px;cursor:pointer;color:var(--cream)}
body.clean .btn{font-size:13px}
.btn:hover{background:#22305A}
.btn.gold{background:var(--gold);color:#1A1204;box-shadow:inset 0 0 0 2px #FFE7A3,inset -3px -3px 0 2px #B58622}
.btn.danger{box-shadow:inset 0 0 0 2px #8A3C30,inset -3px -3px 0 2px #2A0E0A;color:#FFB3A5}
.btn:disabled{opacity:.45;cursor:not-allowed}
.prompter{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:5;width:min(1000px,calc(100% - 24px));height:30px;background:#05060C;border:3px solid #05060C;box-shadow:inset 0 0 0 2px var(--cream);overflow:hidden;pointer-events:none}
.ptrack{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;font-family:var(--f-body);font-size:20px;line-height:1;transition:transform .3s linear;will-change:transform}
.pi{padding:0 14px 0 0;color:#6E6650}.pi b{font-weight:normal;color:#8A7F60;margin-right:6px}.pi::after{content:'◆';color:#3A3446;margin-left:14px}
.pi.now{color:#F4EEDC}.pi.now b{color:var(--gold)}.pi.past{color:#9A9078}.pi.wait.now{color:var(--gold)}.pi.flag.now{color:#FF8A80}
.pmark{position:absolute;top:2px;bottom:2px;left:30%;width:2px;background:var(--gold);box-shadow:0 0 0 1px #05060C}
.prompter::before,.prompter::after{content:'';position:absolute;top:0;bottom:0;width:40px;z-index:1}.prompter::before{left:0;background:linear-gradient(90deg,#05060C,transparent)}.prompter::after{right:0;background:linear-gradient(270deg,#05060C,transparent)}
@media (prefers-reduced-motion:reduce){.ptrack{transition:none}}
.toasts{position:absolute;right:10px;bottom:10px;z-index:6;display:flex;flex-direction:column;gap:6px;align-items:flex-end;max-width:min(380px,calc(100% - 20px))}
.toast{background:#0B0F1E;border:3px solid #05060C;box-shadow:inset 0 0 0 2px var(--gold);padding:6px 6px 6px 10px;display:flex;gap:8px;align-items:center;font-size:17px;line-height:1.1}
.toast .btn{min-height:36px;padding:6px 8px}
@media (max-height:520px){.toasts{top:8px;bottom:auto;max-width:min(360px,calc(100% - 20px))}.toast{font-size:15px}}
.toast .tg{font-family:var(--f-pixel);font-size:7px;background:var(--green);color:#05060C;padding:3px 5px;flex-shrink:0}
.toast button{flex-shrink:0}
.rotate{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;display:none;background:#05060C;border:3px solid var(--gold);padding:10px 12px;font-size:19px;text-align:center}
@media (orientation:portrait) and (max-width:820px){.rotate{display:block}}

/* cards */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,6,12,.55);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.card{width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:3px solid #05060C;box-shadow:inset 0 0 0 2px var(--frame),inset 0 0 0 4px var(--frame-lo)}
.card.narrow{width:min(640px,100%)}
.card.object{width:min(1400px,88vw,100%);height:min(86vh,100%);max-height:100%}
@media (max-width:900px){.card.object{width:100%}}
.card.object .cardbody{flex:1;padding:14px}
.ov{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,30%);grid-template-rows:minmax(0,1fr);gap:14px;height:100%;min-height:0;align-items:stretch}
.ovstage{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.ovside{background:#0E1324;border:2px solid #1C2440;padding:12px;display:flex;flex-direction:column;gap:7px;min-width:0;min-height:0;align-self:stretch;overflow:auto}
.ovside .kv{font-size:18px}
.atast{align-items:center}.atast.compact{justify-content:flex-start}.atast.compact .atapic{height:min(30vh,200px)}.ataphone{width:100%;max-width:560px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}.ataphone h3{margin:2px 0 0;font-family:var(--f-pixel);font-size:9px;color:#E8C060}.ataphone .lrow{font-size:17px;padding:2px 0}.ataphone .btn{padding:6px 8px}.ataphone .paircode{font-size:16px;padding:6px}.atapic{image-rendering:pixelated;height:min(46vh,330px);width:auto;border:3px solid #C9A24E;background:#14121A}.atasay{background:#0E1324;border:2px solid #C9A24E;padding:10px 12px;font-size:20px;max-width:560px}.paircode{font-family:var(--f-pixel);font-size:20px;letter-spacing:3px;color:#F2C14E;background:#05060C;border:2px solid #C9A24E;padding:10px;text-align:center}.atafl{display:flex;flex-wrap:wrap;gap:6px}.atafl .btn{padding:6px 10px;min-width:40px}
.secst{font-family:var(--f-pixel);font-size:8px;padding:3px 5px;border:2px solid #05060C;color:#05060C}.secst.g{background:#63D68F}.secst.b{background:#E36B6B}.secst.w{background:#F2C14E}
.lbl.say{background:#F7F0DE;color:#1A1E2E;border:2px solid #05060C;padding:4px 7px;font-family:var(--f-body);font-size:17px;text-shadow:none;transform:translate(-50%,-100%);max-width:240px;white-space:normal;text-align:center;box-shadow:2px 2px 0 #05060C}.lbl.say.ata{border-color:#C9A24E}
.ovside h3{margin:0;font-family:var(--f-pixel);font-size:10px;color:var(--frame-hi);line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:17px;color:var(--muted)}.legend i{display:inline-block;width:14px;height:10px;border:2px solid #05060C;margin-right:5px;vertical-align:middle}
@media (max-width:900px){.ov{grid-template-columns:1fr;grid-template-rows:auto;height:auto}.card.object{height:100%}}
/* switchboard */
.sbwrap{display:flex;flex-direction:column;gap:10px;height:100%;justify-content:center}
.sbx{background:#6B4430;border:4px solid #05060C;box-shadow:inset 0 0 0 3px #8A5A3E,inset 0 0 0 7px #4A2E1E;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sbrowlbl{background:#C99A2E;border:3px solid #05060C;color:#1A1204;font-family:var(--f-pixel);font-size:9px;padding:4px 10px;letter-spacing:1px}
.sbgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sock3{box-sizing:border-box;position:relative;background:#2A2230;border:3px solid #05060C;box-shadow:inset 0 0 0 2px #3A3046;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.shead{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0}.shead:hover .k,.shead:focus-visible .k{color:var(--gold)}.shead:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sock3 .k{font-family:var(--f-pixel);font-size:10px;color:var(--cream);white-space:nowrap}.sock3 .sys,.sbf .sys{font-size:17px;color:var(--muted);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:#F4EEDC;color:#1A1204;border:2px solid #05060C;font-family:var(--f-pixel);font-size:8px;padding:2px 4px;flex-shrink:0}
.gate{font-family:var(--f-pixel);font-size:7px;color:#1A1204;background:var(--gold);border:2px solid #05060C;padding:2px 4px;flex-shrink:0}
.lamp{width:18px;height:11px;flex-shrink:0;border:2px solid #05060C;background:var(--lc)}.lamp.blink{animation:lampb .66s steps(1) infinite}@keyframes lampb{50%{background:#3A1A1A}}
.srow{display:flex;align-items:flex-end;gap:10px;min-width:0}
.jack{width:38px;height:38px;flex-shrink:0;border:3px solid #05060C;background:radial-gradient(circle,#05060C 0 28%,var(--rd) 29% 52%,var(--rg) 53% 100%)}.jack.big{width:76px;height:76px;border-width:4px}
.plugs{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.plug{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:14px;color:var(--muted);line-height:1}
.plug img{width:30px;height:30px;image-rendering:pixelated;border:2px solid #05060C;background:#0B0D17}.plug b{display:block;width:6px;height:9px;background:var(--cc);border:2px solid #05060C;border-top:0}.plug.aux b{width:3px}.plug.off{opacity:.4}
.plug:hover img,.plug:focus-visible img{border-color:var(--gold)}.plug:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.plug.need img{border-color:var(--gold);animation:needp 1s steps(1) infinite}@keyframes needp{50%{border-color:#05060C}}
@media (prefers-reduced-motion:reduce){.plug.need img,.lamp.blink,.chip8.need{animation:none}}
.sbf{display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
.sbstrip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.chip8{all:unset;box-sizing:border-box;cursor:pointer;background:#2A2230;border:3px solid #05060C;padding:6px;display:flex;align-items:center;gap:6px;font-family:var(--f-pixel);font-size:8px;color:var(--cream);overflow:hidden;white-space:nowrap;min-width:0}
.chip8[aria-current="true"]{box-shadow:inset 0 0 0 3px var(--gold);background:#352C3E}.chip8:hover,.chip8:focus-visible{box-shadow:inset 0 0 0 2px var(--gold)}.chip8 .lamp{width:12px;height:8px}
.chip8.need{color:var(--gold)}
.sbfmain{flex:1;display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:10px;min-height:0}
.chev{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#2A2230;border:3px solid #05060C;box-shadow:inset 0 0 0 2px #3A3046;font-size:30px;color:var(--gold)}
.chev:hover,.chev:focus-visible{box-shadow:inset 0 0 0 3px var(--gold);background:#352C3E}.chev:disabled{opacity:.3;cursor:default}
.sbfcard{background:#6B4430;border:4px solid #05060C;box-shadow:inset 0 0 0 3px #8A5A3E;padding:12px;display:grid;grid-template-columns:minmax(180px,30%) minmax(0,1fr);gap:12px;min-height:0}
.sbfvis{background:#2A2230;border:3px solid #05060C;display:flex;flex-direction:column;align-items:center;padding:14px;min-height:0}
.cordv{flex:1;min-height:16px;width:10px;background:var(--cc);border:3px solid #05060C;border-top:0;border-bottom:0}.cordv.aux{width:6px}.cordv.dash{background:repeating-linear-gradient(180deg,var(--cc) 0 10px,transparent 10px 16px)}.cordv.cut{background:transparent;border-style:dashed}
.bustimg{width:108px;height:126px;image-rendering:pixelated;border:3px solid #05060C;background:#0B0D17;flex-shrink:0}
.sbfinfo{background:#0E1324;border:2px solid #1C2440;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:auto}
.sbfinfo .fk{font-family:var(--f-pixel);font-size:9px;color:var(--frame-hi);line-height:1.5}.sbfinfo h2{margin:0;font-size:30px;font-weight:normal;line-height:1}
.needpill{font-family:var(--f-pixel);font-size:9px;line-height:1.4;padding:5px 8px;border:2px solid #05060C;align-self:flex-start;color:#1A1204;background:var(--nc)}
.sbfinfo .btn{padding:8px 10px}.decbox{background:#121A30;border:2px solid #2A3560;padding:8px 10px}.decbox .kv{font-size:18px;margin-top:4px}
@media (max-width:900px){.sbgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.sbstrip{grid-template-columns:repeat(4,minmax(0,1fr))}.sbfcard{grid-template-columns:1fr}.sbfvis{flex-direction:row;justify-content:center;gap:10px}.cordv{flex:0 0 40px;height:10px;min-height:0;width:40px;border:3px solid #05060C;border-left:0;border-right:0}.bustimg{width:72px;height:84px}}
/* executive */
.mchip{display:inline-block;font-family:var(--f-pixel);font-size:7px;line-height:1.5;padding:2px 5px;border:2px solid #05060C;background:var(--mc);color:#F4EEDC;white-space:nowrap}.mchip.s{font-size:6px;padding:1px 4px}
.rgrid{display:grid;grid-template-columns:minmax(150px,1.4fr) repeat(4,minmax(0,1fr));gap:5px;background:#141826;border:4px solid #05060C;box-shadow:inset 0 0 0 3px #2A3050;padding:10px}
.rcorner{font-family:var(--f-pixel);font-size:8px;color:var(--muted);align-self:end;padding:4px}
.rhead{all:unset;box-sizing:border-box;cursor:pointer;background:#1E2540;border:3px solid #05060C;border-top:6px solid var(--mc);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}.rhead[aria-pressed="true"],.rhead:hover,.rhead:focus-visible{box-shadow:inset 0 0 0 2px var(--gold)}
.rt{display:flex;align-items:center;gap:6px}.rt img{width:26px;height:26px;image-rendering:pixelated;border:2px solid #05060C}.rt b{font-family:var(--f-pixel);font-size:8px;font-weight:normal;color:var(--cream)}
.rb{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--cream)}.rb i{flex:1;height:8px;background:#0E1324;border:2px solid #05060C}.rb i b{display:block;height:100%;background:var(--gold)}

Buf.prototype.set=function(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<this.w&&y<this.h)this.d[y*this.w+x]=c;};

Buf.prototype.outline=function(c){const s=this.d.slice();for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(s[y*this.w+x])continue;if([[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>{const X=x+a,Y=y+b;return X>=0&&Y>=0&&X<this.w&&Y<this.h&&s[Y*this.w+X];}))this.d[y*this.w+x]=c;}};

 const x=document.createElement('button');x.className='btn';x.setAttribute('aria-label','Dismiss');x.textContent='✕';x.addEventListener('click',()=>t.remove());t.appendChild(x);
 const ts=$('toasts');while(ts.children.length>=3)ts.firstChild.remove();ts.appendChild(t);setTimeout(()=>t.remove(),opts.ms||7000);return t;}

const scrim=$('scrim'),cardEl=$('card'),cBody=$('cardBody'),cTabs=$('cardTabs');

 else if(stack.length){stack[stack.length-1].scroll=cBody.scrollTop;}
 if(stack.length>=2)stack=stack.slice(0,1);
 stack.push({kind,opts,scroll:0});renderCard();
}
function renderCard(){
 const top=stack[stack.length-1];if(!top){scrim.hidden=true;return;}
 const def=CARDS[top.kind](top.opts);scrim.hidden=false;cardEl.className='card'+(def.narrow?' narrow':'')+(def.object?' object':'');
 $('cardTitle').textContent=def.title;$('cardCtx').textContent=def.ctx||`${fl(S.floor)}${LIVE()?'':' · replay at '+fmt(S.t)+' '+TZ}`;
 $('cardBack').hidden=stack.length<2&&!top.opts.backToVN;
 if(def.tabs){cTabs.hidden=false;cTabs.innerHTML=def.tabs.map(t=>`<button class="tab" role="tab" data-tab="${t[0]}" aria-selected="${t[0]===def.tab}">${t[1]}</button>`).join('');}else{cTabs.hidden=true;cTabs.innerHTML='';}
 cBody.innerHTML=def.body;if(def.mount)def.mount(cBody);cBody.scrollTop=top.scroll||0;
 const f=cardEl.querySelector('[data-autofocus]')||$('cardClose');if(document.activeElement&&cardEl.contains(document.activeElement)&&!top.refocus){}else{f.focus({preventScroll:true});}top.refocus=false;
}
function rerender(){if(stack.length){const top=stack[stack.length-1];top.scroll=cBody.scrollTop;const a=document.activeElement;const id=a&&a.id;top.refocus=true;renderCard();if(id&&$(id))$(id).focus({preventScroll:true});}}
function backCard(){const top=stack[stack.length-1];if(top&&top.opts.backToVN&&stack.length===1){stack=[];scrim.hidden=true;$('choices').querySelector('button')?.focus();return;}stack.pop();if(stack.length)renderCard();else closeAll();}
function closeAll(){saveDraftFromDom();stack=[];scrim.hidden=true;if(!$('vn').hidden){$('choices').querySelector('button')?.focus();return;}if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus();}
$('cardBack').addEventListener('click',backCard);$('cardClose').addEventListener('click',closeAll);

cTabs.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(!t)return;const top=stack[stack.length-1];top.opts.tab=t.dataset.tab;top.scroll=0;renderCard();cTabs.querySelector(`[data-tab="${t.dataset.tab}"]`)?.focus();});
cTabs.addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const ts=[...cTabs.querySelectorAll('.tab')];const i=ts.indexOf(document.activeElement);const n=ts[(i+(e.key==='ArrowRight'?1:-1)+ts.length)%ts.length];n.click();});
function trap(e,root){if(e.key!=='Tab')return;const f=[...root.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],b=f[f.length-1];if(e.shiftKey&&document.activeElement===a){b.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===b){a.focus();e.preventDefault();}}

 if(!scrim.hidden){trap(e,cardEl);if(e.key==='Escape'){e.preventDefault();if(stack.length>1||stack[0]?.opts.backToVN)backCard();else closeAll();}return;}

});

const WIN_OPEN=22*60,WIN_CLOSE=6*60;
function inWindow(){const m=mod(S.now);return m>=WIN_OPEN||m<WIN_CLOSE;}
function untilWindow(){const m=mod(S.now);const d=(WIN_OPEN-m+1440)%1440;const h=Math.floor(d/60),mm=d%60;return (h?h+' h ':'')+mm+' min';}
function windowText(){return inWindow()?'22:00–06:00 '+TZ+' · open now':'22:00–06:00 '+TZ+' · opens in '+untilWindow();}
function primaryLabel(d){if(d.id==='D-1')return inWindow()?'Authorise deployment now':'Authorise deployment for 22:00';return d.primary;}
function later(ms,fn){setTimeout(fn,S.reduce?Math.min(ms,300):ms);}
function authorise(id){const d=R.decisions.find(x=>x.id===id);if(d.state!=='pending')return;if(d.live&&!liveReady())return;
 if(d.live){d.state='authorised';liveDecide(d,'allow','Approved in Agent HQ');logLive(d.agent,'You allowed: '+d.title+'.');S.override[d.agent]='run';later(400,()=>{if(d.state==='authorised'){d.state='executing';rerender();refresh();}});rerender();refresh();return;}d.state='authorised';logLive(d.agent,`You authorised: ${d.title.toLowerCase()}.`);
 if(d.train){later(700,()=>{d.state='executing';rerender();refresh();later(1500,()=>{d.state='verification pending';rerender();refresh();later(1800,()=>{d.state='verified';applyTrain(d);logLive(d.agent,d.train==='kit'?`Kit v${FIT[d.agent].kit} is live. Regression cases re-run clean.`:`Now level ${FIT[d.agent].level}: ${ladder(d.agent)[0][FIT[d.agent].level-1]}.`);toast(`${A[d.agent].role}: ${d.train==='kit'?'kit v'+FIT[d.agent].kit+' is live':'promoted to level '+FIT[d.agent].level}.`,{action:['FITNESS',()=>openCard('fit',{id:d.agent})]});rerender();refresh();});});});rerender();refresh();return;}
 const a=d.agent;const t=R.tasks.find(x=>x.agent===a&&x.status==='waiting');
 if(d.scheduled&&!inWindow()){S.override[a]='sched';later(1200,()=>{d.state='scheduled';if(t){t.status='queued';t.history.push(`${fmt(S.now)} ${TZ} · scheduled for 22:00 ${TZ}`);}toast(`${A[a].role}: scheduled for 22:00 ${TZ}, in ${untilWindow()}. Nothing changes in production before then.`);rerender();refresh();});}
 else{later(900,()=>{d.state='executing';S.override[a]='run';if(t)t.status='working';rerender();refresh();
   later(3500,()=>{d.state='verification pending';rerender();refresh();
     later(3500,()=>{d.state='verified';S.override[a]='idle';if(FIT[a])FIT[a].real++;if(t){t.status='completed';t.history.push(`${fmt(S.now)} ${TZ} · completed and verified`);}logLive(a,`Done and verified: ${d.title.toLowerCase()}.`);toast(`${A[a].role}: ${d.title.toLowerCase()} is done and verified.`,{action:['VIEW',()=>openCard('decision',{id})]});rerender();refresh();});});});}
 rerender();refresh();}
function submitCommand(to,text){
 const c={id:nid('C'),floor:S.floor,to,text,state:'submitted',t:S.now,links:[],reply:''};R.commands.push(c);
 const tgt=to==='#team'?agentsOn(S.floor).find(i=>A[i].tool==='planner'):to;
 later(1100,()=>{c.state='accepted';c.reply='Acknowledged. Accepting an instruction does not mean it has been done.';rerender();
  later(1600,()=>{const lower=text.toLowerCase();
   if(A[tgt].tool==='planner'&&/plan|project|launch|campaign|prepare|research|build/.test(lower)){const p=createProject(text.length>48?text.slice(0,46)+'…':text,text,'Fri 7 Nov, 17:00',true);c.links.push(...R.tasks.filter(t=>t.project===p.id).map(t=>t.id));c.state='working';c.reply='Planning it now. Tasks are on the whiteboard.';}
   else{const need=needsAuth(tgt,text);const p=R.projects.find(p=>p.floor===S.floor&&R.tasks.some(t=>t.project===p.id&&t.agent===tgt))||R.projects.find(p=>p.floor===S.floor);
     const t=task({project:p.id,title:text.length>60?text.slice(0,58)+'…':text,agent:tgt,status:'working',deadline:null,output:'As described in your instruction',history:[`${fmt(S.now)} ${TZ} · created from your command ${c.id}`]});c.links.push(t.id);c.state='working';
     if(need){const d={id:nid('D'),floor:S.floor,agent:tgt,project:p.id,client:p.client,title:text.length>60?text.slice(0,58)+'…':text,action:'As prepared by '+A[tgt].role,target:p.client,env:'To be confirmed',window:'To be confirmed',why:'Requested by you in command '+c.id+'. Needs authorisation before it takes effect.',change:['Prepared change will be listed here once ready'],rollback:'To be confirmed by the agent',expires:'Mon 26 Oct, 17:00',evidence:[],primary:'Authorise',state:'pending'};R.decisions.push(d);c.links.push(d.id);c.reply='Preparing it. A decision request is waiting for you before anything takes effect.';}
     else c.reply='Working on it. Progress shows on the task.';}
   logLive(tgt,`Accepted your command: “${text.length>50?text.slice(0,48)+'…':text}”`);toast(`${A[tgt].role} accepted your command.`,{action:['VIEW',()=>openCard('desk',{tab:'commands'})]});rerender();refresh();});});
 rerender();
}
function createProject(title,objective,due,fromCmd){
 const f=S.floor;const pm=agentsOn(f).find(i=>A[i].tool==='planner');const workers=agentsOn(f).filter(i=>i!==pm);
 const p={id:nid('P'),floor:f,title,objective,owner:pm,state:'proposed',client:'Internal',milestones:['Plan agreed','Work done','Reviewed'],criteria:['Owner confirms the objective is met']};R.projects.push(p);
 const pick=workers.filter(w=>!['wait','blocked','paused'].includes(status(w))).slice(0,3);const names=['Gather what we already know','Do the main work','Check and summarise'];
 later(800,()=>{p.state='planning';startGather(f,pm,pick.concat([pm]),title);
  pick.forEach((w,i)=>task({project:p.id,title:names[i],agent:w,status:'queued',deadline:due,deadlineState:'proposed',deps:[],output:i===2?'Summary for you':'Notes',history:[`${fmt(S.now)} ${TZ} · proposed by the programme manager`]}));
  later(S.reduce?300:7000,()=>{p.state='active';R.tasks.filter(t=>t.project===p.id).forEach((t,i)=>{if(i===0)t.status='working';});endGather();rerender();refresh();});
  rerender();refresh();});
 if(!fromCmd){const top=stack[stack.length-1];if(top&&top.kind==='board'){top.opts.creating=false;top.opts.p=p.id;}delete S.drafts['np:'+f];rerender();}
 return p;
}

 if(now-(CHAT.st||0)>1){CHAT.st=now;const n=R.decisions.filter(d=>d.state==='pending').length;A.gd1.now=n?`${n} step${n>1?'s are':' is'} held at the gate for your decision, Boss.`:'Gates are clear, Boss. Nothing is waiting.';A.gd2.now=n?'Holding the gate until you decide, Atarah.':'All quiet at the gates, Atarah.';A.gd1.log[0]='at the gate now  '+n;}
 if(!LIVE()){CHAT.on=null;return;}const c=CHAT.on;
 if(c){if(c.floor!==S.floor){CHAT.on=null;return;}if(now>c.until){c.i++;if(c.i>=c.lines.length){CHAT.on=null;CHAT.next=now+10+Math.random()*12;}else c.until=now+3.2;}return;}
 if(now<CHAT.next)return;CHAT.next=now+4;
 const cand=presentOn(S.floor).filter(id=>{const e=E[id],k=status(id);return !e.trip&&!e.path.length&&!e.seated&&!A[id].exec&&(k==='idle'||k==='paused'||k==='wait'||e.at!==A[id].floor);});
 const pairs=[];for(let i=0;i<cand.length;i++)for(let j=i+1;j<cand.length;j++){const p=E[cand[i]],q=E[cand[j]];if(Math.hypot(p.x-q.x,p.y-q.y)<96)pairs.push([cand[i],cand[j]]);}
 if(!pairs.length)return;const [a,b]=pairs[Math.floor(Math.random()*pairs.length)];CHAT.on={floor:S.floor,a,b,lines:chatLines(a,b),i:0,until:now+3.2};}
const GATEPOST={x:15.7,z:7.0,face:-Math.PI/2,stand:1};

// ================= live bridge: Claude Code =================
// Claude Code's HTTP hooks post every step to a small bridge on your computer; the bridge streams them here.
// Shell commands and file edits wait for your decision; everything else just shows up in the room.
const LIVEB={on:false,proj:null,task:null,byTool:{}};
function toolSock(t){return /^(Bash|PowerShell|BashOutput|KillShell|KillBash)$/.test(t)?0:/^(Write|Edit|MultiEdit)$/.test(t)?1:/^(Read|Glob|Grep|LS)$/.test(t)?2:/^(TodoWrite|TaskCreate|TaskUpdate|TaskList|TaskGet)$/.test(t)?3:/^(WebFetch|WebSearch)$/.test(t)?4:/^(Task|Agent)$/.test(t)?5:/^mcp__/.test(t)?6:/^NotebookEdit$/.test(t)?7:2;}
function shortPath(p){if(!p)return '';const a=String(p).split(/[\\/]/).filter(Boolean);return a.slice(-2).join('/');}
function clip(t,n){t=String(t||'').replace(/\s+/g,' ').trim();return t.length>n?t.slice(0,n-1)+'…':t;}
function rel(ev,t){t=String(t||'');const c=String(ev.cwd||'');if(c)t=t.split(c+'/').join('').split(c+'\\').join('').split(c).join('.');return t;}
function toolLine(ev){const i=ev.tool_input||{};switch(ev.tool_name){case 'Bash':case 'PowerShell':return (i.description?i.description+': ':'')+'$ '+clip(rel(ev,i.command),90);case 'Write':return 'Write '+shortPath(i.file_path);case 'Edit':case 'MultiEdit':return 'Edit '+shortPath(i.file_path);case 'NotebookEdit':return 'Edit notebook '+shortPath(i.notebook_path);case 'Read':return 'Read '+shortPath(i.file_path);case 'Glob':return 'Find files '+clip(i.pattern,50);case 'Grep':return 'Search for "'+clip(i.pattern,40)+'"';case 'WebFetch':return 'Fetch '+clip(i.url,60);case 'WebSearch':return 'Search the web: '+clip(i.query,60);case 'TodoWrite':return 'Update its task list';case 'Task':case 'Agent':return 'Start a subagent: '+clip(i.description,50);default:return ev.tool_name.replace(/^mcp__/,'MCP ').replace(/__/g,' ');}}
function liveProject(){if(LIVEB.proj)return LIVEB.proj;const p={id:nid('P'),floor:'f5',title:'Claude Code session',objective:'Whatever you ask Claude Code to do in your terminal',owner:'cc',state:'active',client:'Your computer',milestones:['Prompt','Steps','Done'],criteria:['Every shell command and file edit is approved here']};R.projects.push(p);LIVEB.proj=p;return p;}
function liveLog(text,kind){FLOORS.f5.events.push([S.now,'cc',text,kind]);A.cc.log.unshift(clip(text,60));A.cc.log.length=Math.min(A.cc.log.length,8);}
// on the phone, a live decision is only made while the desktop is connected; it is never queued for later
function liveReady(){return window.HQ_TRANSPORT&&HQ_TRANSPORT.canDecide?HQ_TRANSPORT.canDecide():true;}
function liveDecide(d,decision,reason){if(window.HQ_TRANSPORT){HQ_TRANSPORT.decide(d.hookId,decision,reason);return;}if(!window.HQ_BRIDGE){toast('Not connected to the bridge, so Claude Code did not get this decision.');return;}fetch('/decide',{method:'POST',headers:{'Content-Type':'application/json','X-HQ-Token':HQ_BRIDGE.token},body:JSON.stringify({id:d.hookId,decision,reason})}).then(r=>{if(!r.ok)toast('The bridge did not accept that decision (it may have timed out).');}).catch(()=>toast('Could not reach the bridge.'));}
function liveIn(x){if(x&&x.type==='nexus'){if(x.msg&&x.msg.type==='notify'){toast('Atarah: '+esc(clip(x.msg.text,90)));return;}nxIn(x.msg);return;}
 if(x&&x.type==='bridge-down'){if(LIVEB.on){LIVEB.on=false;A.cc.now='Your desktop is not reachable right now.';refresh();}return;}
 if(x&&x.type==='paired'){toast('Phone paired: '+esc(x.name||'iPhone'),{live:false});if(NX.pairing)NX.pairing=null;loadDevices();return;}
 if(x&&x.type==='hook'&&x.gated&&R.decisions.some(d=>d.hookId===x.id))return;
 const ev=x.ev||{};const a=A.cc;
 if(x.type==='hello'){const back=LIVEB.seen;LIVEB.on=true;LIVEB.seen=true;a.now='Connected. Waiting for Claude Code.';toast(back?'Bridge reconnected.'+(x.resync?' Some events were missed; held steps are refreshed.':''):'Claude Code bridge connected. Floor 5 is live.',back?{live:false}:{action:['GO',()=>switchFloor('f5')]});(x.pending||[]).forEach(liveIn);refresh();return;}
 if(x.type==='synced'){const live=new Set(x.pending||[]);let n=0;R.decisions.forEach(d=>{if(d.live&&d.state==='pending'&&!live.has(d.hookId)){d.state='failed';d.note='No longer waiting: the bridge restarted or Claude Code stopped';n++;}});if(n){liveLog(n+' held step'+(n>1?'s':'')+' no longer waiting','flag');S.override.cc='run';rerender();refresh();}return;}
 if(x.type==='expired'||x.type==='decided'){const d=R.decisions.find(y=>y.hookId===x.id);if(d&&(d.state==='pending'||x.type==='expired'&&d.state==='authorised')){if(x.type==='expired'){d.state='failed';d.note=x.reason==='bridge-restarted'?'No longer waiting: the bridge restarted':'Claude Code stopped waiting';liveLog('Stopped waiting for: '+d.title,'flag');}S.override.cc='run';}rerender();refresh();return;}
 if(x.type!=='hook')return;
 switch(ev.hook_event_name){
  case 'UserPromptSubmit':{const p=liveProject();const t=task({project:p.id,agent:'cc',title:clip(ev.prompt,70),status:'working',scope:clip(ev.prompt,400),deadline:null});t.history.push(`${fmt(S.now)} ${TZ} · you asked Claude Code`);LIVEB.task=t.id;S.override.cc='run';a.now='Working on: '+clip(ev.prompt,120);liveLog('You asked: '+clip(ev.prompt,90));break;}
  case 'PreToolUse':{a.curSock=toolSock(ev.tool_name);const line=toolLine(ev);a.now=line;
   if(x.gated){const i=ev.tool_input||{};const p=liveProject();const shell=/Bash|PowerShell/.test(ev.tool_name);
    const change=shell?['$ '+clip(rel(ev,i.command),600)]:ev.tool_name==='Write'?['Write '+(i.file_path||'')+' ('+String(i.content||'').length+' characters)',clip(i.content,400)]:/Edit/.test(ev.tool_name)?['Edit '+(i.file_path||''),'Replace: '+clip(i.old_string||(i.edits&&i.edits[0]&&i.edits[0].old_string),200),'With: '+clip(i.new_string||(i.edits&&i.edits[0]&&i.edits[0].new_string),200)]:[clip(JSON.stringify(i),400)];
    const d={id:nid('D'),live:true,hookId:x.id,toolUse:ev.tool_use_id,floor:'f5',agent:'cc',project:p.id,client:'Your computer',title:clip(line,80),action:shell?'Run a shell command':ev.tool_name+' a file',target:shell?'Folder: '+shortPath(ev.cwd):shortPath(i.file_path||i.notebook_path),env:'Your computer · '+shortPath(ev.cwd)+(ev.permission_mode&&ev.permission_mode!=='default'?' · mode: '+ev.permission_mode:''),window:'Now',
     why:i.description?i.description:'Claude Code needs this step to carry on with: '+(R.tasks.find(t=>t.id===LIVEB.task)||{title:'your prompt'}).title,change,rollback:shell?'Not automatic. Check the command before allowing it.':'Not automatic. Your editor or git can undo file changes.',expires:fmt(S.now+5)+' (Claude Code then asks you itself)',evidence:[],primary:shell?'Allow this command':'Allow this edit',state:'pending'};
    R.decisions.push(d);S.override.cc='wait';liveLog('Asked you to allow: '+line,'wait');toast('Claude Code: '+clip(line,70),{action:['REVIEW',()=>openCard('decision',{id:d.id})]});}
   else{S.override.cc='run';liveLog(line);}
   LIVEB.byTool[ev.tool_use_id]=line;break;}
  case 'PostToolUse':case 'PostToolUseFailure':{const ok=ev.hook_event_name==='PostToolUse';const d=R.decisions.find(y=>y.live&&y.toolUse&&y.toolUse===ev.tool_use_id);if(d&&!['declined','changes requested','failed'].includes(d.state)){d.state=ok?'verified':'failed';}
   const t=R.tasks.find(y=>y.id===LIVEB.task);if(t)t.evidence.push({n:clip(LIVEB.byTool[ev.tool_use_id]||ev.tool_name,60),ok});if(!ok){liveLog('Failed: '+(LIVEB.byTool[ev.tool_use_id]||ev.tool_name),'flag');}S.override.cc=ok?'run':'fix';break;}
  case 'Notification':{a.now=clip(ev.message,140);liveLog(clip(ev.message,90),/permission|waiting|input/i.test(ev.message||'')?'wait':'');break;}
  case 'Stop':{const t=R.tasks.find(y=>y.id===LIVEB.task);if(t){handoff({from:'cc',to:'you',floor:'f5',task:'Finished: '+t.title,summary:clip(ev.last_assistant_message,400)||'Finished.',evidence:t.evidence.map(e=>e.n).slice(0,6),constraints:['Shell commands and file edits were approved in Agent HQ'],open:[],fromModel:'claude',toModel:null});t.status='completed';t.output=clip(ev.last_assistant_message,600);t.history.push(`${fmt(S.now)} ${TZ} · finished`);}a.curSock=null;S.override.cc='idle';a.now=ev.last_assistant_message?'Finished: '+clip(ev.last_assistant_message,140):'Finished. Waiting for your next prompt.';liveLog('Finished'+(t?': '+t.title:''));break;}
  case 'SessionEnd':{S.override.cc='idle';a.curSock=null;a.now='Session ended. Waiting for Claude Code.';liveLog('Session ended');break;}}
 rerender();refresh();}
if(window.HQ_TRANSPORT){try{HQ_TRANSPORT.stream(liveIn);}catch(e){console.warn('transport',e);}}
else if(window.HQ_BRIDGE){try{const es=new EventSource('/events?t='+encodeURIComponent(HQ_BRIDGE.token));es.onmessage=m=>{try{liveIn(JSON.parse(m.data));}catch(e){console.error(e);}};es.onerror=()=>{if(es.readyState===2){A.cc.now='The bridge was reset and this page can no longer reach it. Reload the page.';LIVEB.on=false;refresh();toast('The bridge was reset. Reload this page to reconnect.',{live:false});return;}if(LIVEB.on){LIVEB.on=false;A.cc.now='Bridge disconnected. Reconnecting when it is back…';refresh();}};}catch(e){console.warn('bridge',e);}}
try{R3=init3D();}catch(e){R3=null;if(window.console)console.warn('3D view unavailable, using the flat view',e);fc.style.display='';}
if(R3)fit();
snapAll();refresh();requestAnimationFrame(frame);
window.__hq={NX,CHAT,selectFloor,nxIn,LIVEB,liveIn,E,A,presentOn,openVN,openCard,S,R,refresh,switchFloor,goLive,authorise,submitCommand,createProject,closeAll};
})();
